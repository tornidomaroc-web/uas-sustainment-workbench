name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types (strict)
        run: python -m mypy
      - name: Tests (synthetic fixtures and licensed excerpts only; no network)
        run: python -m pytest -rs
      - name: Static demo builds from the code
        run: |
          uasw --db /tmp/fleet.sqlite seed
          uasw --db /tmp/fleet.sqlite export-static --out /tmp/site
          test -s /tmp/site/fleet.json && test -s /tmp/site/index.html
          grep -q '"status_reasons"' /tmp/site/fleet.json
          grep -q 'cycles past its' /tmp/site/fleet.json
          test -s /tmp/site/assistant.json && grep -q '"grounding_verified": true' /tmp/site/assistant.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t uasw:ci .
      - name: Start and probe the service
        run: |
          # Requests from the host reach the container from the Docker bridge, not from
          # loopback, so writes need a token; a random one for this run only.
          TOKEN=$(openssl rand -hex 16)
          docker run -d --name uasw -p 127.0.0.1:8000:8000 -e UASW_WRITE_TOKEN="$TOKEN" uasw:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/aircraft | grep -q '"alfa-fixed-wing"'
          curl -fsS http://127.0.0.1:8000/aircraft/alfa-fixed-wing/reconcile | grep -q "355 s of flight"
          curl -fsS http://127.0.0.1:8000/aircraft/SYN-04/due | grep -q '"unserviceable"'
          curl -fsS http://127.0.0.1:8000/fleet/due | grep -q "cycles past its"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q uasw_aircraft_by_status
          # The ledger: a write without the token is refused, one with it is appended and
          # changes the board, and an impossible one is refused with a sentence, never a 500.
          ENTRY='{"subject":"SYN-01","kind":"work_order.open","occurred_utc":"2026-09-20T09:00:00Z","entered_by":"CI probe, maintenance","statement":"[ci] replacement propeller set on order","details":{"state":"awaiting_parts"}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$ENTRY" http://127.0.0.1:8000/entries)" = 401
          curl -fsS -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -d "$ENTRY" http://127.0.0.1:8000/entries | grep -q '"does not certify airworthiness'
          curl -fsS http://127.0.0.1:8000/aircraft/SYN-01 | grep -q '"AOG"'
          BAD='{"subject":"SYN-01","kind":"work_order.close","occurred_utc":"2026-09-21T09:00:00Z","entered_by":"CI probe, maintenance","statement":"[ci] closing nothing","details":{"work_id":"WO-none"}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -d "$BAD" http://127.0.0.1:8000/entries)" = 409
          docker logs uasw | head -5
      - name: Stop
        if: always()
        run: docker rm -f uasw

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the browser check
        run: |
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Render the generated page in headless Chromium
        run: python -m pytest -q -m browser -rs tests/test_page_browser.py
